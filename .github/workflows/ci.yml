name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Test
        env:
          GOTOOLCHAIN: local
        run: go test ./internal/... ./cmd/... -tags=unit_test

      - name: Build
        env:
          GOTOOLCHAIN: local
        run: go build -o /tmp/kafka-canary ./cmd/

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Pull Kafka image
        run: docker pull quay.io/strimzi/kafka:1.2.0-kafka-4.3.1

      - name: E2E
        env:
          GOTOOLCHAIN: local
        run: go test ./test/... -tags=e2e -count=1 -timeout 12m -v

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Lint chart
        run: helm lint deploy/helm/kafka-canary
      - name: Template chart
        run: helm template kafka-canary deploy/helm/kafka-canary > /tmp/kafka-canary.yaml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: kafka-canary:ci
